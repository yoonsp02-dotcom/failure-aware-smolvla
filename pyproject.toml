[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failure-aware-smolvla"
version = "0.1.0"
description = "Failure-aware evaluation tools for SmolVLA on LIBERO"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
